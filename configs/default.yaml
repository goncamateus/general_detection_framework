# GDF Training Configuration
# Usage: gdf train --config configs/default.yaml

model_version: v26
model_size: n
source: local
data_path: data/my_dataset
epochs: 100
batch_size: 16
imgsz: 224
lr: 0.001
output_dir: runs/train
project_name: gdf-exp
use_wandb: true
use_tensorboard: true
workers: 8
patience: 50
device: auto

